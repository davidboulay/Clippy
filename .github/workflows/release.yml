name: Release

# Push a tag like v0.2.0 to build the Linux .deb + macOS .dmg and publish a
# GitHub Release with both artifacts.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0 fakeroot

      - name: Build .deb
        run: ./packaging/deb/build-deb.sh

      - name: Publish release with the .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.deb \
            --title "${GITHUB_REF_NAME}" --generate-notes \
          || gh release upload "${GITHUB_REF_NAME}" dist/*.deb --clobber

  macos:
    runs-on: macos-latest
    # Run after the .deb job so the release already exists; this job only
    # uploads the .dmg to it. The .app is ad-hoc signed (no Developer ID), so
    # Gatekeeper still shows "unidentified developer" on first launch.
    needs: deb
    steps:
      - uses: actions/checkout@v7

      - name: Build .app + .dmg
        run: ./packaging/macos/build-app.sh --dmg

      - name: Upload the .dmg to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The deb job already created the release; upload with --clobber so
          # re-runs are idempotent. Fall back to create if it's somehow missing.
          gh release upload "${GITHUB_REF_NAME}" dist/*.dmg --clobber \
          || gh release create "${GITHUB_REF_NAME}" dist/*.dmg \
               --title "${GITHUB_REF_NAME}" --generate-notes

  # Rebuild the APT index so `apt upgrade` sees this version. Called directly
  # rather than left to apt-repo.yml's `on: release` trigger: we publish the
  # release with ${{ github.token }}, and GitHub raises no workflow-triggering
  # event for a GITHUB_TOKEN action, so that trigger never fired for a tagged
  # release — four versions shipped without the index being rebuilt. A direct
  # call needs no event delivery, so it cannot silently skip.
  #
  # `needs: macos` is transitively after `deb` (macos already needs it), so the
  # release exists with its .deb attached before the index is collected.
  apt:
    needs: macos
    permissions:
      contents: write
    secrets: inherit          # apt-repo needs APT_GPG_PRIVATE_KEY to sign
    uses: ./.github/workflows/apt-repo.yml

  # Push the same version to the AUR, so `yay -Syu` / `paru -Syu` picks it up
  # the way `apt upgrade` does for the .deb. Without this the AUR package is
  # updated by hand — three files, one of them a checksum — which is the same
  # manual step that let four releases ship without an APT index (see above).
  #
  # Runs after `deb` only for ordering; the source it publishes is GitHub's own
  # tag tarball, which exists the moment the tag is pushed.
  #
  # makepkg is Arch-only, so the Arch-specific half runs in a container while
  # checkout stays on the runner. Skipped, not failed, when the deploy key is
  # absent: a release must not be blocked on a channel that isn't set up yet.
  # See packaging/aur/README.md for the one-time account setup.
  aur:
    needs: deb
    runs-on: ubuntu-24.04
    steps:
      - name: Check for AUR credentials
        id: gate
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$AUR_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set — skipping the AUR publish."
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.ready == 'true'

      - name: Install the deploy key
        if: steps.gate.outputs.ready == 'true'
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$AUR_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"

      - name: Publish to the AUR
        if: steps.gate.outputs.ready == 'true'
        run: |
          docker run --rm \
            -v "$PWD:/repo" -v "$HOME/.ssh:/keys:ro" \
            -e GIT_SSH_COMMAND="ssh -i /keys/aur -o StrictHostKeyChecking=accept-new" \
            -e VERSION="${GITHUB_REF_NAME#v}" \
            archlinux:base-devel bash -euo pipefail -c '
              pacman -Sy --noconfirm --needed git openssh curl >/dev/null
              cd /repo && ./packaging/aur/publish.sh "$VERSION"
            '

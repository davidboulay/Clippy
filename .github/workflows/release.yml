name: Release

# Push a tag like v0.2.0 to build the Linux .deb + macOS .dmg and publish a
# GitHub Release with both artifacts.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0 fakeroot

      - name: Build .deb
        run: ./packaging/deb/build-deb.sh

      - name: Publish release with the .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.deb \
            --title "${GITHUB_REF_NAME}" --generate-notes \
          || gh release upload "${GITHUB_REF_NAME}" dist/*.deb --clobber

  macos:
    runs-on: macos-latest
    # Run after the .deb job so the release already exists; this job only
    # uploads the .dmg to it. The .app is ad-hoc signed (no Developer ID), so
    # Gatekeeper still shows "unidentified developer" on first launch.
    needs: deb
    steps:
      - uses: actions/checkout@v4

      - name: Build .app + .dmg
        run: ./packaging/macos/build-app.sh --dmg

      - name: Upload the .dmg to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The deb job already created the release; upload with --clobber so
          # re-runs are idempotent. Fall back to create if it's somehow missing.
          gh release upload "${GITHUB_REF_NAME}" dist/*.dmg --clobber \
          || gh release create "${GITHUB_REF_NAME}" dist/*.dmg \
               --title "${GITHUB_REF_NAME}" --generate-notes

  # Rebuild the APT index so `apt upgrade` sees this version. Called directly
  # rather than left to apt-repo.yml's `on: release` trigger: we publish the
  # release with ${{ github.token }}, and GitHub raises no workflow-triggering
  # event for a GITHUB_TOKEN action, so that trigger never fired for a tagged
  # release — four versions shipped without the index being rebuilt. A direct
  # call needs no event delivery, so it cannot silently skip.
  #
  # `needs: macos` is transitively after `deb` (macos already needs it), so the
  # release exists with its .deb attached before the index is collected.
  apt:
    needs: macos
    permissions:
      contents: write
    secrets: inherit          # apt-repo needs APT_GPG_PRIVATE_KEY to sign
    uses: ./.github/workflows/apt-repo.yml

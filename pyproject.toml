[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "clippy"
dynamic = ["version"]
description = "A Paste-style clipboard history panel for Wayland (Hyprland/Omarchy, COSMIC, wlroots) and macOS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# NOTE: PyGObject, gtk-layer-shell and AppIndicator come from system packages
# (see README / scripts/install.sh), not from PyPI. LAN sync needs PyNaCl +
# zeroconf — on Linux install the system packages python3-nacl + python3-zeroconf;
# the extras below are for pip-based installs (e.g. macOS).
dependencies = []

[project.optional-dependencies]
sync = ["pynacl", "zeroconf", "spake2==0.8"]
macos = ["pynacl", "zeroconf", "spake2==0.8", "pyobjc-framework-Cocoa"]

[project.scripts]
clippy = "clippy.cli:main"

[tool.setuptools.dynamic]
# Single source of truth: clippy/__init__.py. Hand-maintained here,
# this drifted from 0.2.0 to 1.5.2 without anyone noticing.
version = { attr = "clippy.__version__" }

[tool.setuptools]
packages = ["clippy", "clippy.backends", "clippy.desktops"]
